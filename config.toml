# Mọi ngưỡng và tham số nằm ở đây (PLAN BR-11) — không viết cứng trong code.

[paths]
data_dir = "data"
db_file = "data/market.db"
raw_dir = "data/raw"

[crawl]
user_agent = "jobmarket-crawl/0.1 (personal, non-commercial, low-rate)"
min_delay_seconds = 2.5
timeout_seconds = 30
max_retries = 2
# Dừng một nguồn khi tỷ lệ request lỗi trong lần chạy vượt ngưỡng này
stop_error_rate = 0.2
# Tin không còn thấy trên nguồn quá N ngày → trạng thái 'expired' (chỉ đánh dấu sau lần chạy có dữ liệu). Chỉ áp
# dụng cho nguồn KHÔNG quét sâu (deep_pages_per_run = 0); nguồn quét sâu hết hạn theo vòng quét trọn.
expire_unseen_days = 14
# Nguồn chặn ta (challenge/403/429/trang rỗng nghi hạn chế ngầm) N lần chạy liền → nghỉ hours × 2^(N-1) giờ, tối đa
# max_hours, tính từ lần bị chặn cuối. `run --force` và `start --now` KHÔNG bỏ qua được (2026-11-09: CareerLink bị chạy
# 3 lần cách 15–30 phút bằng --force → bị chặn ngay trang đầu). 0 = tắt.
blocked_cooldown_hours = 6
blocked_cooldown_max_hours = 24

# QUY TẮC THU THẬP (2026-11-09) — chi tiết: .claude/agents/jobmarket-dev.md
#   Xanh  (tự làm): robots cho phép + User-Agent trung thực + kênh site công bố cho máy (sitemap, JSON-LD,
#                   __NEXT_DATA__); nhịp = max(min_delay_seconds, Crawl-delay của robots).
#   Vàng  (bạn duyệt từng nguồn): trang bạn tự mở/tự lưu (import-html, userscript), bộ dữ liệu công khai, xin phép/API
#                   đối tác, đổi thư viện HTTP (User-Agent vẫn trung thực).
#   Đỏ    (không làm): giả User-Agent/dấu vân tay TLS trình duyệt, trình duyệt tự động giải challenge, điều khiển trình
#                   duyệt của bạn để tự động duyệt site đã chặn, proxy xoay vòng, giải captcha, đăng nhập, đường dẫn
#                   robots cấm.

[sources.topcv]
# TẮT 2026-11-03: TopCV chặn bot tự khai danh tính (Cloudflare challenge) — dữ liệu TopCV chỉ vào qua
# `import-html` (trang bạn tự lưu). Không đổi User-Agent để né chặn. Xem docs/spike-0.md.
enabled = false
start_url = "https://www.topcv.vn/tim-viec-lam-moi-nhat"
# Userscript `scripts/topcv-save.user.js` (mức Vàng — chỉ trang BẠN tự mở, bấm nút hoặc bật tự lưu): tải trang về đây
# với tên `jobmarket-topcv-*.html`; `start`/`watch`/`import-html` chuyển các file đó vào data/inbox/topcv rồi nạp.
# Chỉ đụng file đúng tiền tố đó. Rỗng = tắt.
downloads_dir = "~/Downloads"

# Nguồn có phân trang: mỗi đêm duyệt tối đa `max_pages` trang mỗi danh sách, dừng sớm khi
# `stop_after_known_pages` trang liên tiếp không có tin mới. Lần đầu muốn lấy nhiều: `run --max-pages 40`.
[sources.careerlink]
enabled = true
start_url = "https://www.careerlink.vn/vieclam/list"
# 2026-11-03: CareerLink hạn chế ngầm (trả trang không có tin, HTTP 200) sau ~25 request/1 phút và ~55 request/9 phút
# → giới hạn theo SỐ request trong một khoảng thời gian; tự gỡ sau ~3,5 giờ. Tôn trọng: mỗi lần chạy ≤ ~50 request
# (40 danh sách + 10 chi tiết), cách nhau ≥ 4 giờ (`start` hoặc Task Scheduler — chọn một), dừng ngay khi phát hiện.
min_delay_seconds = 10
max_requests = 40
# `run --full` (quét trọn, không giới hạn số request): nghỉ 15 giây/request = 36 request/9 phút, dưới ngưỡng
# hạn chế đo được (~55/9 phút). Vẫn bị chặn → dừng + nghỉ (blocked_cooldown_*).
full_min_delay_seconds = 15
max_pages = 10
stop_after_known_pages = 3
# Quét sâu: sau phần đầu danh sách, đọc tiếp N trang từ chỗ dừng lần trước (crawl_listings.resume_page) → danh sách
# chung 688 trang (~34.400 tin) được phủ dần qua nhiều lần chạy thay vì chỉ ~10 trang đầu. Vẫn trong `max_requests`.
# Quét toàn site (2026-11-04): 25 trang sâu/lần (lùi 2) → ~23 trang mới/lần; 6 lần/ngày ≈ 5 ngày/vòng.
deep_pages_per_run = 25
# Lùi N trang khi đọc tiếp: tin phía trên hết hạn làm các tin dịch lên trang đã đọc → không sót tin.
deep_overlap_pages = 2
# Tầng 2: số trang chi tiết (JSON-LD: ngành, kinh nghiệm, ngày đăng, hạn nộp) đọc mỗi lần chạy, mới nhất trước
detail_max_per_run = 10
# Duyệt thêm trang theo ngành/tỉnh tự phát hiện trên trang (gắn được ngành cho tin)
max_listings = 150
# Ưu tiên trang danh mục (2026-11-09): danh sách chung không có ngành → cho nó vào vòng xoay như các danh mục (duyệt
# lâu nhất trước) để ngân sách request dồn cho danh mục chưa quét; quét trọn mọi danh mục 1 vòng thì ngành theo danh
# mục được tính tỷ trọng (chia đều). Tắt (false) = danh sách chung luôn đi đầu (phủ tin mới nhất, hết hạn nhanh hơn).
category_first = true

[sources.vieclam24h]
# Khảo sát 2026-11-04: robots cho phép, bot tự khai danh tính nhận 200, không challenge. Trang danh sách nhúng dữ liệu
# có cấu trúc (__NEXT_DATA__, 30 tin/trang, tổng ~17.000 tin): ngành/nghề, tỉnh, kinh nghiệm, cấp bậc, lương số, ngày
# đăng, hạn nộp → không cần trang chi tiết. Trang tìm nhanh chỉ phân trang ~34 trang → thêm 53 trang theo nghề.
enabled = true
start_url = "https://vieclam24h.vn/tim-kiem-viec-lam-nhanh"
min_delay_seconds = 10
max_requests = 55
# 2026-11-04: trang 2 (`?page=2`) trả 403 cho bot (robots không cấm) → tạm chỉ đọc trang 1 của trang tìm nhanh + 53
# trang nghề (ước ~1.600 tin/lần, chưa chạy thật với cấu hình này), không thử vượt. Thử lại phân trang sau: đặt max_pages = 34.
max_pages = 1
stop_after_known_pages = 3
deep_pages_per_run = 0
max_listings = 60
# Có hạn nộp từng tin → trạng thái theo hạn nộp; không đánh dấu hết hạn vì "không thấy" (danh sách chỉ phân trang
# ~34 trang mỗi nghề, không phủ trọn mỗi lần).
expire_unseen = false
# Sitemap (2026-11-09, mức Xanh): robots khai sitemap; sitemap tin ~4 file × 5.000 URL, cập nhật hằng ngày; trang chi
# tiết (bot tự khai danh tính nhận 200) có đủ trường như trang danh sách. Tin chưa thấy ở danh sách → đọc trang chi
# tiết, mã tin lớn (mới) trước. Đính chính 2026-11-11: trước ghi "robots Crawl-delay 5" — kiểm lại thấy `Crawl-delay: 5`
# chỉ trong nhóm SemrushBot/AhrefsBot; nhóm `*` (bot này) KHÔNG khai nhịp.
# `run --full`: 5 giây/request = đúng nhịp site đòi ở bot SEO lớn (~15.900 trang chi tiết: 44 → ~22 giờ). Chạy thường giữ 10.
full_min_delay_seconds = 5
# Trang chi tiết (2026-11-11): mô tả + yêu cầu công việc chỉ có ở trang chi tiết → đọc cho tin thấy ở trang danh sách
# (tin từ sitemap đã ghi luôn khi lưu). `run --full` = không giới hạn.
detail_max_per_run = 60
sitemap_url = "https://vieclam24h.vn/file/sitemap/sitemap-index.xml"
sitemap_refresh_hours = 24
sitemap_max_files = 10
# 2026-11-11: 100 → 300 (user: "quét nhiều tin lên"). ~50 phút/lần ở 10 giây/request; ~15.700 tin chưa thấy → ~9 ngày
# nếu chạy 6 lần/ngày. Chưa thấy bị chặn ở trang chi tiết (11/11: ~1.100 trang liền không lỗi). Bị chặn → tự nghỉ.
sitemap_max_per_run = 300

[sources.careerviet]
# Khảo sát 2026-11-04: robots (User-agent: *) chỉ cấm /vi/jobs/*, /api/*… → trang danh sách được phép; bot tự khai danh
# tính nhận 200. 50 tin/trang, danh sách "tất cả việc làm" phân trang …-trang-<n>-vi.html. Thẻ tin: lương, tỉnh, hạn
# nộp, ngày cập nhật, ngành (1–3 mục). Một số tin không có hạn nộp → hết hạn theo vòng quét trọn như CareerLink.
enabled = true
start_url = "https://careerviet.vn/viec-lam/tat-ca-viec-lam-vi.html"
min_delay_seconds = 10
# 2026-11-11: 40/25 → 90/75 (user: "quét nhiều tin lên"). Chưa từng bị chặn/hạn chế; 370 trang → vòng quét trọn
# ~5 lần chạy thay vì ~15. ~15 phút/lần.
max_requests = 90
max_pages = 10
stop_after_known_pages = 3
deep_pages_per_run = 75
deep_overlap_pages = 2
max_listings = 5  # chưa dùng: CareerViet chỉ có 1 danh sách chung (không phát hiện danh mục)

[sources.itviec]
# Khảo sát 2026-11-10 (mức Xanh): robots `Allow: /`, bot tự khai danh tính nhận 200 ở mọi trang danh sách + chi tiết.
# Cả site ~620 tin IT, 20 tin/trang, ~31 trang → mỗi lần chạy quét trọn (phần đầu + quét sâu) → hết hạn theo vòng quét.
# Không có lương (ẩn, cần đăng nhập) và cấp bậc; kinh nghiệm JSON-LD không đáng tin → bỏ (xem sources/itviec.py).
enabled = true
start_url = "https://itviec.com/it-jobs"
min_delay_seconds = 10
max_requests = 40
max_pages = 5
stop_after_known_pages = 3
deep_pages_per_run = 30
deep_overlap_pages = 1
max_listings = 1
# Trang chi tiết (JSON-LD): ngày đăng chính xác, hạn nộp → trạng thái, mô tả. Lần đầu ~620 tin ≈ 21 lần chạy.
detail_max_per_run = 60  # 2026-11-11: 30 → 60 (~620 tin ≈ 11 lần chạy)

[sources.jobsgo]
# TẮT 2026-11-03: lần chạy thật bị 403 challenge ngay trang đầu (khảo sát bằng curl trước đó vẫn 200).
# Không chỉnh header/giả lập để né. Có thể thử bật lại sau vài ngày: `run --source jobsgo --max-pages 1`.
enabled = false
# Duyệt theo từng ngành cấp 1 (~32 ngành) để biết ngành của tin
start_url = "https://jobsgo.vn/viec-lam.html"
max_pages = 5
stop_after_known_pages = 2

[normalize]
fx_usd_vnd = 25500
salary_min_valid = 1_000_000  # chỉ bắt lỗi đơn vị (vd "0.1 triệu"); lương thực tập/part-time 1–3 triệu là thật
salary_max_valid = 500_000_000
week_to_month = 4.33
hour_to_month = 208

[stats]
min_n_salary = 5
min_vol_trend = 10
trend_threshold = 0.10
window_days = 30
# Nguồn không cho biết trạng thái tin: coi là đang tuyển nếu thấy trong N ngày gần nhất. 0 = tin chưa bị đánh dấu
# hết hạn là còn tuyển — dùng với quét sâu (một vòng quét CareerLink mất nhiều ngày; hết hạn do vòng quét trọn
# quyết định, xem pipeline.mark_expired).
active_seen_days = 0
# Khoảng lương rộng hơn N lần (vd 10–200 triệu "lương cứng + hoa hồng") → không vào thống kê lương; 0 = tắt
max_range_ratio = 5
# Lương đại diện > N VND/tháng (vd "500 triệu" — nhập sai hoặc lương năm) → không vào thống kê lương; 0 = tắt
max_monthly_salary = 150000000
# Tin chưa có ngày đăng mà thấy lần đầu trong N ngày đầu tiên thu thập nguồn = tồn sẵn → không tính là tin mới
backlog_grace_days = 0

[quality]
# Ngưỡng chất lượng theo nguồn (tab Quality của mockup)
max_reject = 0.02
min_location = 0.95
min_industry = 0.90
min_occupation = 0.80
min_experience = 0.90
# Huy hiệu độ tin cậy (PLAN §B6): Cao nếu n ≥ high_n và mọi chỉ số phủ đạt; Vừa nếu n ≥ mid_n; còn lại Thấp
confidence_high_n = 30
confidence_mid_n = 10

[mysql]
# Bản sao để xem bằng MySQL Workbench — DB chính vẫn là SQLite (paths.db_file). enabled = true: tự đồng bộ sau mỗi
# lần `run`/`start` crawl xong; tắt thì vẫn chạy tay được `jobmarket mysql-sync`. Mỗi lần đồng bộ dựng lại toàn bộ
# bảng trong schema → đừng sửa dữ liệu ở MySQL. Mật khẩu: biến môi trường JOBMARKET_MYSQL_PASSWORD (mặc định rỗng).
enabled = true
host = "127.0.0.1"
port = 3306
user = "root"
database = "jobmarket"
